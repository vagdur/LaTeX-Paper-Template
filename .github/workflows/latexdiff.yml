name: latexdiff on push

on:
  push:
    branches:
      - "**"   # run on all branches; adjust if you only want main

permissions:
  contents: write   # needed to push the diff PDF

jobs:
  diff:
    runs-on: ubuntu-latest
    env:
      MAIN_TEX: main.tex   # <-- set this to your top-level TeX file
      DIFF_FILE: diff      # Files (diff.tex and diff.pdf) where diff will be shown
    steps:
      - name: Check out repo with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if this is the first commit
        run: |
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "No previous commit to diff against. Exiting."
            echo "skip=true" >> $GITHUB_OUTPUT
          fi
        id: firstcheck

      - name: Install TeX Live + latexdiff + latexmk
        if: steps.firstcheck.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science texlive-binaries \
            latexmk ghostscript

      - name: Build old and new trees with worktrees
        if: steps.firstcheck.outputs.skip != 'true'
        run: |
          git worktree add ../old HEAD~1
          git worktree add ../new HEAD
          ls -la ../old
          ls -la ../new

      - name: Run latexdiff (flatten includes) and compile
        if: steps.firstcheck.outputs.skip != 'true'
        run: |
          DIFF_TEX="$DIFF_FILE.tex"
          DIFF_PDF="$DIFF_FILE.pdf"

          # Create a flattened diff TeX
          latexdiff --flatten "../old/$MAIN_TEX" "../new/$MAIN_TEX" > "$DIFF_TEX"

          # Compile non-interactively; run twice to resolve references if needed
          latexmk -pdf -interaction=nonstopmode -halt-on-error "$DIFF_TEX"
          # latexmk leaves the PDF next to the .tex (here inside $DIFF_DIR)
          test -f "$DIFF_PDF" || { echo "Failed to produce $DIFF_PDF"; exit 1; }

          echo "pdf_path=$DIFF_PDF" >> $GITHUB_OUTPUT
        id: build

      - name: Commit the PDF back to the repo
        if: steps.firstcheck.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIFF_FILE.pdf"
          # Use [skip ci] to avoid retriggering this workflow
          git commit -m "Add latexdiff PDF for $NEW_SHA [skip ci]" || echo "Nothing to commit."
          git push
