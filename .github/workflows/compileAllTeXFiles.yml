name: Build and latexdiff

on:
  push:
    branches: ["**"]

permissions:
  contents: write

# Prevent overlapping pushes from multiple runs
concurrency:
  group: commit-to-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_diff:
    runs-on: ubuntu-latest
    container: 
      image: texlive/texlive:latest
    env:
      # List your TeX root files here, one per line. Paths allowed,
      # and globs are supported.
      ROOT_FILES: |
        main.tex
      DIFF_DIR: diffs

    steps:
      - name: Checkout with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git safe directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
 
      - name: Determine base commit to diff against
        id: first
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Diff against the remote tip before this push, so every commit in
          # the push is covered (not just HEAD~1, which misses earlier commits
          # in a multi-commit push and, for a merge commit, is only the
          # first parent). Fall back to HEAD~1 for new branches, force
          # pushes where the old tip is unavailable, and reruns.
          echo "Current commit: $(git rev-parse HEAD)"
          BASE=""
          if [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] \
              && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            BASE="$(git rev-parse HEAD~1)"
          fi
          if [[ -n "$BASE" ]]; then
            echo "Diff base: $BASE"
            echo "base=$BASE" >> $GITHUB_OUTPUT
            echo "skip_diff=false" >> $GITHUB_OUTPUT
          else
            echo "No base commit available - skipping diff"
            echo "skip_diff=true" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Resolve ROOT_FILES globs to concrete files
        id: resolve
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          : > files-to-diff.txt
          while IFS= read -r pattern || [ -n "$pattern" ]; do
            [[ -z "$pattern" ]] && continue
            # Expand the glob; if nothing matches, continue silently
            matches=( $pattern )
            for f in "${matches[@]}"; do
              # Only include regular files
              [[ -f "$f" ]] && printf '%s\n' "$f" >> files-to-diff.txt
            done
          done <<< "${ROOT_FILES}"
          if [[ ! -s files-to-diff.txt ]]; then
            echo "No files matched ROOT_FILES patterns" >&2
            exit 1
          fi
        shell: bash

      - name: Build TeX roots
        run: |
          echo "Compiling LaTeX files..."
          while IFS= read -r ROOT || [ -n "$ROOT" ]; do
            [ -z "$ROOT" ] && continue
            echo "::group::Compiling $ROOT"
            echo "Compiling $ROOT..."
            # Run pdflatex twice for cross-references. -recorder writes a
            # .fls file listing every file read, used to find dependencies.
            pdflatex -recorder -interaction=nonstopmode -halt-on-error "$ROOT" || {
              echo "::error::Failed to compile $ROOT"
              exit 1
            }
            pdflatex -recorder -interaction=nonstopmode -halt-on-error "$ROOT" || {
              echo "::error::Failed to compile $ROOT (second pass)"
              exit 1
            }
            # Record the git-tracked files this root depends on
            # (\input, classes, .bib, graphics, ...).
            SAFE="${ROOT//\//__}"
            mkdir -p "$RUNNER_TEMP/deps"
            FLS="$(basename "${ROOT%.tex}").fls"
            { printf '%s\n' "$ROOT"
              sed -n 's/^INPUT //p' "$FLS" | sed 's|^\./||' | grep -v '^/' || true
            } | sort -u | while IFS= read -r dep; do
              git ls-files --error-unmatch -- "$dep" >/dev/null 2>&1 && printf '%s\n' "$dep"
            done > "$RUNNER_TEMP/deps/$SAFE.txt" || true
            echo "Dependencies of $ROOT:"
            sed 's/^/  /' "$RUNNER_TEMP/deps/$SAFE.txt"
            echo "✅ Successfully compiled $ROOT"
            echo "::endgroup::"
          done < files-to-diff.txt
        shell: bash

      - name: Detect roots with changed dependencies
        id: changed
        if: steps.first.outputs.skip_diff != 'true'
        env:
          BASE: ${{ steps.first.outputs.base }}
        run: |
          # A diff PDF is only worth regenerating (and committing) if a file
          # the root depends on changed. PDFs are not byte-reproducible, so
          # rebuilding unconditionally would commit a new diff on every push.
          # Note: changes to non-text dependencies (images, .bib) count too.
          : > roots-changed.txt
          while IFS= read -r ROOT || [ -n "$ROOT" ]; do
            [ -z "$ROOT" ] && continue
            SAFE="${ROOT//\//__}"
            mapfile -t deps < "$RUNNER_TEMP/deps/$SAFE.txt"
            if [ "${#deps[@]}" -eq 0 ] || ! git diff --quiet "$BASE" HEAD -- "${deps[@]}"; then
              echo "Changed: $ROOT"
              printf '%s\n' "$ROOT" >> roots-changed.txt
            else
              echo "Unchanged: $ROOT"
            fi
          done < files-to-diff.txt
          if [[ -s roots-changed.txt ]]; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Prepare old/new trees
        if: steps.changed.outputs.any_changed == 'true'
        env:
          BASE: ${{ steps.first.outputs.base }}
        run: |
          git worktree add ../old "$BASE"
          git worktree add ../new HEAD

      - name: Generate latexdiff sources
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          mkdir -p "$DIFF_DIR"
          while IFS= read -r ROOT || [ -n "$ROOT" ]; do
            [ -z "$ROOT" ] && continue
            # Sanitize path for folder name: replace / with __
            SAFE="${ROOT//\//__}"
            OUT_DIR="$DIFF_DIR/$SAFE"
            mkdir -p "$OUT_DIR"
            echo "::group::latexdiff $ROOT"
            latexdiff --flatten "../old/$ROOT" "../new/$ROOT" > "$OUT_DIR/diff.tex"
            echo "::endgroup::"
          done < roots-changed.txt
        shell: bash

      - name: Compile diffs to PDF
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          echo "Compiling latexdiff files..."
          while IFS= read -r ROOT || [ -n "$ROOT" ]; do
            DIFF_FILE="$DIFF_DIR/${ROOT//\//__}/diff.tex"
            echo "::group::Compiling $DIFF_FILE"
            echo "Compiling $DIFF_FILE..."
            # Change to the directory containing the .tex file before compilation
            DIFF_DIR_PATH=$(dirname "$DIFF_FILE")
            pushd "$DIFF_DIR_PATH" >/dev/null
            DIFF_FILE_NAME=$(basename "$DIFF_FILE")
            
            # Run pdflatex twice for cross-references
            pdflatex -interaction=nonstopmode -halt-on-error "$DIFF_FILE_NAME" || {
              echo "::warning::Failed to compile $DIFF_FILE (first pass)"
            }
            pdflatex -interaction=nonstopmode -halt-on-error "$DIFF_FILE_NAME" || {
              echo "::warning::Failed to compile $DIFF_FILE (second pass)"
            }
            # Debug: Show current working directory and files in the diff directory
            echo "🔍 Debug: Current working directory: $(pwd)"
            echo "🔍 Debug: Files in current directory:"
            ls -la . || echo "Directory not found or not accessible"
            echo "🔍 Debug: Expected PDF path: diff.pdf"
            echo "🔍 Debug: Files matching *.pdf in current directory:"
            find . -name "*.pdf" -type f 2>/dev/null || echo "No PDF files found"
            
            if [ -f "diff.pdf" ]; then
              echo "✅ Successfully compiled $DIFF_FILE"
            else
              echo "❌ No PDF produced for $DIFF_FILE"
            fi
            popd >/dev/null
            echo "::endgroup::"
          done < roots-changed.txt
        shell: bash

      - name: Report missing diff PDFs (non-fatal warnings)
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r ROOT || [ -n "$ROOT" ]; do
            [[ -z "$ROOT" ]] && continue
            SAFE="${ROOT//\//__}"
            OUT_DIR="$DIFF_DIR/$SAFE"
            PDF="$OUT_DIR/diff.pdf"
            LOG="$OUT_DIR/diff.log"
            
            # Debug: Show what we're looking for and what exists
            echo "🔍 Debug: Checking for PDF at: $PDF"
            echo "🔍 Debug: OUT_DIR contents:"
            ls -la "$OUT_DIR" 2>/dev/null || echo "OUT_DIR not found: $OUT_DIR"
            echo "🔍 Debug: Files matching *.pdf in $OUT_DIR:"
            find "$OUT_DIR" -name "*.pdf" -type f 2>/dev/null || echo "No PDF files found in $OUT_DIR"
            
            if [[ ! -f "$PDF" ]]; then
              echo "::warning title=latexdiff compile failed::No PDF produced for '$ROOT'. See log at $LOG (if present)."
              failed=$((failed+1))
            else
              echo "✅ Found PDF at: $PDF"
            fi
          done < roots-changed.txt
          echo "Missing PDFs: $failed"
        shell: bash

      - name: Upload diff logs
        if: steps.changed.outputs.any_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: latexdiff-logs
          path: |
            ${{
              env.DIFF_DIR
            }}/**/diff.log
          if-no-files-found: ignore

      - name: Commit updated diff PDFs
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIFF_DIR"/*/diff.pdf || true
          git commit -m "Update latexdiff PDFs [skip ci]" || echo "Nothing to commit"
          git push || echo "No changes to push"
