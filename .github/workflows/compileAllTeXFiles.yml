name: Build and latexdiff

on:
  push:
    branches: ["**"]

permissions:
  contents: write

# Prevent overlapping pushes from multiple runs
concurrency:
  group: commit-to-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_diff:
    runs-on: ubuntu-latest
    env:
      # List your TeX root files here, one per line. Paths allowed,
      # and globs are supported.
      ROOT_FILES: |
        main.tex
      DIFF_DIR: diffs

    steps:
      - name: Checkout with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect first commit (no diff possible)
        id: first
        run: |
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "skip_diff=true" >> $GITHUB_OUTPUT
          fi

      - name: Resolve ROOT_FILES globs to concrete files
        id: resolve
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          : > files-to-diff.txt
          while IFS= read -r pattern || [ -n "$pattern" ]; do
            [[ -z "$pattern" ]] && continue
            # Expand the glob; if nothing matches, continue silently
            matches=( $pattern )
            for f in "${matches[@]}"; do
              # Only include regular files
              [[ -f "$f" ]] && printf '%s\n' "$f" >> files-to-diff.txt
            done
          done <<< "${ROOT_FILES}"
          if [[ ! -s files-to-diff.txt ]]; then
            echo "No files matched ROOT_FILES patterns" >&2
            exit 1
          fi

      - name: Install latexdiff
        run: |
          sudo apt-get update
          sudo apt-get install -y latexdiff

      - name: Build TeX roots
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ env.ROOT_FILES }}
          # optional: set a TeX Live year for reproducibility
          # texlive_version: 2024
          # Enable shell-escape if your doc needs it
          # latexmk_use_lualatex: true
          # latexmk_shell_escape: true
          # Install latexdiff ahead of time via tlmgr so it's available next step

      - name: Prepare old/new trees
        if: steps.first.outputs.skip_diff != 'true'
        run: |
          git worktree add ../old HEAD~1
          git worktree add ../new HEAD

      - name: Generate latexdiff sources
        if: steps.first.outputs.skip_diff != 'true'
        run: |
          mkdir -p "$DIFF_DIR"
          while IFS= read -r ROOT || [ -n "$ROOT" ]; do
            [ -z "$ROOT" ] && continue
            # Sanitize path for folder name: replace / with __
            SAFE="${ROOT//\//__}"
            OUT_DIR="$DIFF_DIR/$SAFE"
            mkdir -p "$OUT_DIR"
            echo "::group::latexdiff $ROOT"
            latexdiff --flatten "../old/$ROOT" "../new/$ROOT" > "$OUT_DIR/diff.tex"
            echo "::endgroup::"
          done < files-to-diff.txt

      - name: Compile diffs to PDF with latex-action
        if: steps.first.outputs.skip_diff != 'true'
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ env.DIFF_DIR }}/**/diff.tex
          continue_on_error: true
          # texlive_version: 2024
          # If diffs use minted or similar, uncomment shell escape:
          # latexmk_shell_escape: true

      - name: Report missing diff PDFs (non-fatal warnings)
        if: steps.first.outputs.skip_diff != 'true'
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r ROOT || [ -n "$ROOT" ]; do
            [[ -z "$ROOT" ]] && continue
            SAFE="${ROOT//\//__}"
            OUT_DIR="$DIFF_DIR/$SAFE"
            PDF="$OUT_DIR/diff.pdf"
            LOG="$OUT_DIR/diff.log"
            if [[ ! -f "$PDF" ]]; then
              echo "::warning title=latexdiff compile failed::No PDF produced for '$ROOT'. See log at $LOG (if present)."
              failed=$((failed+1))
            fi
          done < files-to-diff.txt
          echo "Missing PDFs: $failed"

      - name: Upload diff logs
        if: steps.first.outputs.skip_diff != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: latexdiff-logs
          path: |
            ${{
              env.DIFF_DIR
            }}/**/diff.log
          if-no-files-found: ignore

      - name: Commit updated diff PDFs
        if: steps.first.outputs.skip_diff != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIFF_DIR"/*/diff.pdf || true
          git commit -m "Update latexdiff PDFs [skip ci]" || echo "Nothing to commit"
          git push || echo "No changes to push"
